name: Base path regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: intl, mbstring, dom
      - run: php tests/base-path.php '' && php tests/base-path.php /wishthis && php tests/base-path.php /apps/wishes
      - run: python3 tests/base-path-http.py
      - run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l && php -l index.php
      - run: find src/assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
